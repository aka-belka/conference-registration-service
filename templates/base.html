{% load static %}
<!DOCTYPE html> 
<html lang="ru"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1"> 
    <title>{% block title %}{% endblock %}</title> 
    <link 
        rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3 
            /dist/css/bootstrap.min.css" 
    >
    <link 
        rel="stylesheet" 
        href="{% static 'homepage/css/style.css' %}" 
    > 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head> 
<body> 
    <header class="site-header">
        <div class="container header-inner">
            <a href="{% url 'homepage:index' %}" class="logo-link">
                <img
                    src="{% static 'homepage/img/logo.webp' %}"
                    alt="Сервис регистрации"
                    class="conference-logo"
                >
            </a>
            <nav class="navbar navbar-expand-lg navbar-light bg-light px-3">
                <div class="container-fluid">
                    <button class="navbar-toggler" type="button"
                            data-bs-toggle="collapse" data-bs-target="#mainNav"
                            aria-controls="mainNav" aria-expanded="false"
                            aria-label="Переключить навигацию">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="mainNav">
                        <ul class="navbar-nav">
                            {% include "includes/navigation.html" %}
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
    </header>
    
    <main class="container"> 
        {% block content %} 
        {% endblock %} 
    </main> 

    <footer class="container mt-4 mb-3"> 
        <p>© <span id="current-year"></span> Сервис регистрации</p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script> 
</body> 
</html>
